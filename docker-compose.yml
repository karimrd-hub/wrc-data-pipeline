# Local dev infra for the WRC pipeline.
# Reviewer runbook: `docker compose up -d` — no .env editing required.
# Every value has a sensible default; a .env at repo root overrides them.

services:
  mongo:
    image: mongo:7
    container_name: wrc-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  minio:
    image: minio/minio:latest
    container_name: wrc-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Dagster webserver (Dagit UI). Split from the daemon so the
  # QueuedRunCoordinator (see ``dagster.yaml``) can dispatch multiple partition
  # runs concurrently instead of running them serially inside ``dagster dev``.
  # Both services share the ``dagster_home`` volume so run state, event log,
  # and the queue table are visible to both.
  dagster-webserver: &dagster_service
    build: .
    container_name: wrc-dagster-webserver
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${DAGSTER_PORT:-3000}:3000"
    environment: &dagster_env
      DAGSTER_HOME: /opt/dagster_home
      DAGSTER_MAX_CONCURRENT_RUNS: ${DAGSTER_MAX_CONCURRENT_RUNS:-12}
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-wrc}
      MONGO_LANDING_COLLECTION: ${MONGO_LANDING_COLLECTION:-landing_metadata}
      MONGO_PROCESSED_COLLECTION: ${MONGO_PROCESSED_COLLECTION:-processed_metadata}
      MONGO_SERVER_SELECTION_TIMEOUT_MS: ${MONGO_SERVER_SELECTION_TIMEOUT_MS:-5000}
      MONGO_CONNECT_TIMEOUT_MS: ${MONGO_CONNECT_TIMEOUT_MS:-5000}
      MONGO_SOCKET_TIMEOUT_MS: ${MONGO_SOCKET_TIMEOUT_MS:-30000}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_SECURE: "false"
      MINIO_LANDING_BUCKET: ${MINIO_LANDING_BUCKET:-landing-zone}
      MINIO_PROCESSED_BUCKET: ${MINIO_PROCESSED_BUCKET:-processed}
      MINIO_CONNECT_TIMEOUT_SEC: ${MINIO_CONNECT_TIMEOUT_SEC:-5.0}
      MINIO_READ_TIMEOUT_SEC: ${MINIO_READ_TIMEOUT_SEC:-30.0}
      SCRAPER_PARTITION_SIZE: ${SCRAPER_PARTITION_SIZE:-monthly}
      SCRAPER_CONCURRENT_REQUESTS: ${SCRAPER_CONCURRENT_REQUESTS:-16}
      SCRAPER_CONCURRENT_REQUESTS_PER_DOMAIN: ${SCRAPER_CONCURRENT_REQUESTS_PER_DOMAIN:-16}
      SCRAPER_DOWNLOAD_DELAY: ${SCRAPER_DOWNLOAD_DELAY:-0.0}
      SCRAPER_AUTOTHROTTLE_ENABLED: ${SCRAPER_AUTOTHROTTLE_ENABLED:-true}
      SCRAPER_AUTOTHROTTLE_START_DELAY: ${SCRAPER_AUTOTHROTTLE_START_DELAY:-0.25}
      SCRAPER_AUTOTHROTTLE_MAX_DELAY: ${SCRAPER_AUTOTHROTTLE_MAX_DELAY:-10.0}
      SCRAPER_AUTOTHROTTLE_TARGET_CONCURRENCY: ${SCRAPER_AUTOTHROTTLE_TARGET_CONCURRENCY:-7.0}
      SCRAPER_RETRY_TIMES: ${SCRAPER_RETRY_TIMES:-5}
      # Left unset here defers to config/settings.py's built-in default; the
      # colon-and-comma format would tangle with compose's `${VAR:-default}`
      # interpolation, so we only pass a value if the reviewer set one.
      SCRAPER_BODIES: ${SCRAPER_BODIES-}
      SCRAPER_LOG_LEVEL: ${SCRAPER_LOG_LEVEL:-INFO}
      TRANSFORM_BULK_BATCH_SIZE: ${TRANSFORM_BULK_BATCH_SIZE:-200}
      DAGSTER_PARTITION_START_DATE: ${DAGSTER_PARTITION_START_DATE:-2020-01-01}
      DAGSTER_SUBPROCESS_TIMEOUT_SEC: ${DAGSTER_SUBPROCESS_TIMEOUT_SEC:-3600}
      DAGSTER_LANDING_MAX_RETRIES: ${DAGSTER_LANDING_MAX_RETRIES:-2}
      DAGSTER_LANDING_RETRY_DELAY_SEC: ${DAGSTER_LANDING_RETRY_DELAY_SEC:-30}
      DAGSTER_PROCESSED_MAX_RETRIES: ${DAGSTER_PROCESSED_MAX_RETRIES:-2}
      DAGSTER_PROCESSED_RETRY_DELAY_SEC: ${DAGSTER_PROCESSED_RETRY_DELAY_SEC:-15}
    volumes:
      - dagster_home:/opt/dagster_home
      - ./dagster.yaml:/opt/dagster_home/dagster.yaml:ro
    restart: unless-stopped
    command:
      - dagster-webserver
      - --host
      - 0.0.0.0
      - --port
      - "3000"
      - -m
      - wrc_pipeline.orchestration

  # Dagster daemon: dequeues runs from the QueuedRunCoordinator and launches
  # them. Without this service, queued runs would sit in the queue forever.
  # Shares the image, env, and DAGSTER_HOME with the webserver via YAML anchors.
  dagster-daemon:
    <<: *dagster_service
    container_name: wrc-dagster-daemon
    environment: *dagster_env
    ports: []
    command:
      - dagster-daemon
      - run
      - -m
      - wrc_pipeline.orchestration

  # One-shot: waits for MinIO to be healthy, then creates the landing + processed
  # buckets idempotently. Exits 0 when done. Not restarted.
  minio-init:
    image: minio/mc:latest
    container_name: wrc-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER:-minioadmin}" "$${MINIO_ROOT_PASSWORD:-minioadmin}" &&
        mc mb --ignore-existing "local/$${MINIO_LANDING_BUCKET:-landing-zone}" &&
        mc mb --ignore-existing "local/$${MINIO_PROCESSED_BUCKET:-processed}" &&
        echo "buckets ready"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_LANDING_BUCKET: ${MINIO_LANDING_BUCKET:-landing-zone}
      MINIO_PROCESSED_BUCKET: ${MINIO_PROCESSED_BUCKET:-processed}
    restart: "no"

volumes:
  mongo_data:
  minio_data:
  dagster_home:
